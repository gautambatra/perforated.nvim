name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests bench
      - uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: lua plugin

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.11.4, v0.12.5, nightly]
        case: [default]
        include:
          # macOS-like server on Linux: case-insensitive p4d + mixed-case paths.
          - os: ubuntu-latest
            nvim: v0.12.5
            case: insensitive
    name: test (${{ matrix.os }}, ${{ matrix.nvim }}${{ matrix.case == 'insensitive' && ', case-insensitive' || '' }})
    runs-on: ${{ matrix.os }}
    env:
      PERFORATED_P4D_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Cache test dependencies (mini.nvim, p4, p4d)
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-r25.2-${{ hashFiles('Makefile') }}
      - run: make deps
      - name: Mixed-case temp dir (case-insensitive leg)
        if: matrix.case == 'insensitive'
        run: mkdir -p "$RUNNER_TEMP/MixedCase/Tmp" && echo "PERFORATED_TEST_TMP=$RUNNER_TEMP/MixedCase/Tmp" >> "$GITHUB_ENV"
      - run: make test
      - name: Performance budgets
        run: make bench
